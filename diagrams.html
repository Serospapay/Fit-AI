<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Блок-схема БД та логічна схема ІС — Кишеньковий тренер</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 2rem; background: #0d0d0d; font-family: 'Segoe UI', system-ui, sans-serif; color: #e0e0e0; }
    h1 { color: #d4af37; text-align: center; font-size: 2rem; margin-bottom: 2rem; }
    h2 { color: #d4af37; font-size: 1.35rem; margin: 2.5rem 0 1rem; }
    .diagram-wrap { background: #1a1a1a; border-radius: 12px; border: 1px solid rgba(212,175,55,0.3); padding: 2rem; overflow-x: auto; margin-bottom: 3rem; }
    svg { display: block; }
  </style>
</head>
<body>
  <h1>Архітектура системи «Кишеньковий тренер»</h1>

  <h2>Блок-схема бази даних (ER-діаграма)</h2>
  <div class="diagram-wrap">
    <svg viewBox="0 0 1000 720" width="100%" height="720" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
          <path d="M0,0 L0,6 L6,3 z" fill="#d4af37"/>
        </marker>
        <marker id="arrow2" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
          <path d="M0,0 L0,6 L6,3 z" fill="#6ea8fe"/>
        </marker>
      </defs>

      <!-- User -->
      <rect x="400" y="20" width="200" height="70" rx="4" fill="#1e3a5f" stroke="#d4af37" stroke-width="2"/>
      <rect x="400" y="20" width="200" height="28" rx="4" fill="#d4af37"/>
      <text x="500" y="40" text-anchor="middle" fill="#0d0d0d" font-weight="bold" font-size="14">User</text>
      <text x="415" y="58" fill="#bbb" font-size="11">id, email, name</text>
      <text x="415" y="72" fill="#bbb" font-size="11">age, height, weight, goal</text>

      <!-- Схема: Тренування -->
      <rect x="20" y="130" width="300" height="280" rx="6" fill="none" stroke="#444" stroke-width="1" stroke-dasharray="6 4"/>
      <text x="170" y="155" text-anchor="middle" fill="#888" font-size="12">Тренування</text>

      <rect x="40" y="170" width="260" height="65" rx="4" fill="#16213e" stroke="#6ea8fe" stroke-width="1"/>
      <rect x="40" y="170" width="260" height="24" rx="4" fill="#6ea8fe"/>
      <text x="170" y="187" text-anchor="middle" fill="#0d0d0d" font-weight="bold" font-size="12">Workout</text>
      <text x="55" y="205" fill="#bbb" font-size="10">id, userId, date, type, duration, rating</text>
      <text x="55" y="218" fill="#aaa" font-size="10">notes, status</text>

      <path d="M 400 90 L 170 90 L 170 170" stroke="#d4af37" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
      <text x="260" y="82" fill="#d4af37" font-size="9">1:N</text>

      <rect x="40" y="260" width="260" height="65" rx="4" fill="#16213e" stroke="#6ea8fe" stroke-width="1"/>
      <rect x="40" y="260" width="260" height="24" rx="4" fill="#6ea8fe"/>
      <text x="170" y="277" text-anchor="middle" fill="#0d0d0d" font-weight="bold" font-size="12">WorkoutExercise</text>
      <text x="55" y="295" fill="#bbb" font-size="10">id, workoutId, exerciseId</text>
      <text x="55" y="308" fill="#aaa" font-size="10">sets, reps, weight, duration</text>

      <path d="M 170 235 L 170 260" stroke="#6ea8fe" stroke-width="1" fill="none" marker-end="url(#arrow2)"/>
      <text x="180" y="250" fill="#6ea8fe" font-size="9">1:N</text>

      <rect x="40" y="350" width="260" height="50" rx="4" fill="#1a1a2e" stroke="#4a5568" stroke-width="1"/>
      <rect x="40" y="350" width="260" height="22" rx="4" fill="#4a5568"/>
      <text x="170" y="365" text-anchor="middle" fill="#fff" font-weight="bold" font-size="11">Exercise</text>
      <text x="55" y="382" fill="#888" font-size="10">id, name (довідник)</text>

      <path d="M 170 325 L 170 350" stroke="#6ea8fe" stroke-width="1" fill="none" marker-end="url(#arrow2)"/>
      <text x="180" y="340" fill="#6ea8fe" font-size="9">N:1</text>

      <!-- Схема: Харчування -->
      <rect x="350" y="130" width="300" height="280" rx="6" fill="none" stroke="#444" stroke-width="1" stroke-dasharray="6 4"/>
      <text x="500" y="155" text-anchor="middle" fill="#888" font-size="12">Харчування</text>

      <rect x="370" y="170" width="260" height="65" rx="4" fill="#16213e" stroke="#6ea8fe" stroke-width="1"/>
      <rect x="370" y="170" width="260" height="24" rx="4" fill="#6ea8fe"/>
      <text x="500" y="187" text-anchor="middle" fill="#0d0d0d" font-weight="bold" font-size="12">NutritionLog</text>
      <text x="385" y="205" fill="#bbb" font-size="10">id, userId, date, mealType</text>

      <path d="M 500 90 L 500 170" stroke="#d4af37" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
      <text x="512" y="132" fill="#d4af37" font-size="9">1:N</text>

      <rect x="370" y="260" width="260" height="65" rx="4" fill="#16213e" stroke="#6ea8fe" stroke-width="1"/>
      <rect x="370" y="260" width="260" height="24" rx="4" fill="#6ea8fe"/>
      <text x="500" y="277" text-anchor="middle" fill="#0d0d0d" font-weight="bold" font-size="12">NutritionItem</text>
      <text x="385" y="295" fill="#bbb" font-size="10">id, nutritionLogId, name, amount</text>
      <text x="385" y="308" fill="#aaa" font-size="10">calories, protein, carbs, fat</text>

      <path d="M 500 235 L 500 260" stroke="#6ea8fe" stroke-width="1" fill="none" marker-end="url(#arrow2)"/>
      <text x="512" y="250" fill="#6ea8fe" font-size="9">1:N</text>

      <rect x="370" y="350" width="260" height="50" rx="4" fill="#1a1a2e" stroke="#4a5568" stroke-width="1"/>
      <rect x="370" y="350" width="260" height="22" rx="4" fill="#4a5568"/>
      <text x="500" y="365" text-anchor="middle" fill="#fff" font-weight="bold" font-size="11">Food</text>
      <text x="385" y="382" fill="#888" font-size="10">id, name, calories, БЖУ (довідник)</text>

      <!-- Схема: Цілі, нагадування -->
      <rect x="680" y="130" width="300" height="280" rx="6" fill="none" stroke="#444" stroke-width="1" stroke-dasharray="6 4"/>
      <text x="830" y="155" text-anchor="middle" fill="#888" font-size="12">Цілі та нагадування</text>

      <rect x="700" y="170" width="260" height="60" rx="4" fill="#16213e" stroke="#6ea8fe" stroke-width="1"/>
      <rect x="700" y="170" width="260" height="24" rx="4" fill="#6ea8fe"/>
      <text x="830" y="187" text-anchor="middle" fill="#0d0d0d" font-weight="bold" font-size="12">Goal</text>
      <text x="715" y="205" fill="#bbb" font-size="10">id, userId, title, targetValue, currentValue</text>

      <path d="M 580 90 L 700 90 L 700 170" stroke="#d4af37" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
      <text x="635" y="82" fill="#d4af37" font-size="9">1:N</text>

      <rect x="700" y="255" width="260" height="60" rx="4" fill="#16213e" stroke="#6ea8fe" stroke-width="1"/>
      <rect x="700" y="255" width="260" height="24" rx="4" fill="#6ea8fe"/>
      <text x="830" y="272" text-anchor="middle" fill="#0d0d0d" font-weight="bold" font-size="12">Reminder</text>
      <text x="715" y="290" fill="#bbb" font-size="10">id, userId, type, title, time, daysOfWeek</text>

      <path d="M 600 90 L 600 212 L 830 212 L 830 255" stroke="#d4af37" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
      <text x="605" y="155" fill="#d4af37" font-size="9">1:N</text>

      <rect x="700" y="340" width="260" height="55" rx="4" fill="#16213e" stroke="#6ea8fe" stroke-width="1"/>
      <rect x="700" y="340" width="260" height="24" rx="4" fill="#6ea8fe"/>
      <text x="830" y="357" text-anchor="middle" fill="#0d0d0d" font-weight="bold" font-size="12">Recommendation</text>
      <text x="715" y="375" fill="#bbb" font-size="10">id, userId, type, title, message, isRead</text>

      <path d="M 620 90 L 620 280 L 830 280 L 830 340" stroke="#d4af37" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
      <text x="625" y="190" fill="#d4af37" font-size="9">1:N</text>

      <!-- Схема: Шаблони та довідники -->
      <rect x="20" y="440" width="960" height="260" rx="6" fill="none" stroke="#444" stroke-width="1" stroke-dasharray="6 4"/>
      <text x="500" y="465" text-anchor="middle" fill="#888" font-size="12">Шаблони та довідники</text>

      <rect x="50" y="485" width="200" height="55" rx="4" fill="#16213e" stroke="#6ea8fe" stroke-width="1"/>
      <rect x="50" y="485" width="200" height="24" rx="4" fill="#6ea8fe"/>
      <text x="150" y="502" text-anchor="middle" fill="#0d0d0d" font-weight="bold" font-size="12">WorkoutTemplate</text>
      <text x="65" y="520" fill="#bbb" font-size="10">id, userId, name, type, exercises</text>

      <path d="M 420 90 L 420 412 L 150 412 L 150 485" stroke="#d4af37" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
      <text x="280" y="455" fill="#d4af37" font-size="9">1:N</text>

      <rect x="280" y="485" width="180" height="55" rx="4" fill="#1a1a2e" stroke="#4a5568" stroke-width="1"/>
      <rect x="280" y="485" width="180" height="24" rx="4" fill="#4a5568"/>
      <text x="370" y="502" text-anchor="middle" fill="#fff" font-weight="bold" font-size="11">Quote</text>
      <text x="295" y="520" fill="#888" font-size="10">id, text, author</text>

      <rect x="500" y="485" width="180" height="55" rx="4" fill="#1a1a2e" stroke="#4a5568" stroke-width="1"/>
      <rect x="500" y="485" width="180" height="24" rx="4" fill="#4a5568"/>
      <text x="590" y="502" text-anchor="middle" fill="#fff" font-weight="bold" font-size="11">Exercise</text>
      <text x="515" y="520" fill="#888" font-size="10">id, name</text>

      <rect x="720" y="485" width="180" height="55" rx="4" fill="#1a1a2e" stroke="#4a5568" stroke-width="1"/>
      <rect x="720" y="485" width="180" height="24" rx="4" fill="#4a5568"/>
      <text x="810" y="502" text-anchor="middle" fill="#fff" font-weight="bold" font-size="11">Food</text>
      <text x="735" y="520" fill="#888" font-size="10">id, name, calories, БЖУ</text>
    </svg>
  </div>

  <h2>Логічна схема інформаційної системи</h2>
  <div class="diagram-wrap">
    <svg viewBox="0 0 500 420" width="100%" height="420" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
          <path d="M0,0 L0,6 L6,3 z" fill="#d4af37"/>
        </marker>
      </defs>
      <rect x="100" y="20" width="300" height="60" rx="8" fill="#1e3a5f" stroke="#d4af37" stroke-width="2"/>
      <text x="250" y="48" text-anchor="middle" fill="#d4af37" font-weight="bold" font-size="14">Користувач (браузер)</text>
      <text x="250" y="65" text-anchor="middle" fill="#bbb" font-size="11">Введення даних, перегляд статистики</text>
      <path d="M 250 80 L 250 115" stroke="#d4af37" stroke-width="1" fill="none" marker-end="url(#arr)"/>
      <text x="260" y="100" fill="#d4af37" font-size="10">HTTP/HTTPS</text>
      <rect x="100" y="120" width="300" height="60" rx="8" fill="#1a472a" stroke="#2d8a4e" stroke-width="2"/>
      <text x="250" y="148" text-anchor="middle" fill="#2d8a4e" font-weight="bold" font-size="14">Веб-інтерфейс (Next.js, React)</text>
      <text x="250" y="165" text-anchor="middle" fill="#bbb" font-size="11">Рендеринг, форми, виклики API</text>
      <path d="M 250 180 L 250 215" stroke="#d4af37" stroke-width="1" fill="none" marker-end="url(#arr)"/>
      <text x="260" y="198" fill="#d4af37" font-size="10">REST API</text>
      <rect x="100" y="220" width="300" height="60" rx="8" fill="#1e3a5f" stroke="#6ea8fe" stroke-width="2"/>
      <text x="250" y="248" text-anchor="middle" fill="#6ea8fe" font-weight="bold" font-size="14">Backend API (Express.js)</text>
      <text x="250" y="265" text-anchor="middle" fill="#bbb" font-size="11">Валідація, JWT, обробка запитів</text>
      <path d="M 250 280 L 250 315" stroke="#d4af37" stroke-width="1" fill="none" marker-end="url(#arr)"/>
      <text x="260" y="298" fill="#d4af37" font-size="10">Prisma ORM</text>
      <rect x="100" y="320" width="300" height="60" rx="8" fill="#2d1b2e" stroke="#a855f7" stroke-width="2"/>
      <text x="250" y="348" text-anchor="middle" fill="#a855f7" font-weight="bold" font-size="14">База даних (PostgreSQL)</text>
      <text x="250" y="365" text-anchor="middle" fill="#bbb" font-size="11">Зберігання даних</text>
    </svg>
  </div>
</body>
</html>
